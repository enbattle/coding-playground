name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancels a run still in progress for the same branch/PR when a new commit lands on it — otherwise
# every push to an active PR queues a full run that's obsolete before it even finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: verify and e2e push, comment, and write nothing — read-only access to
# repo contents is all `actions/checkout` needs. Only `deploy` overrides this, for Pages alone.
permissions:
  contents: read

# Runners are pinned to ubuntu-24.04 rather than ubuntu-latest, so a GitHub image migration can't
# break Playwright's `install --with-deps` (and with it, every deploy) without warning. Move to a
# newer image deliberately, in its own PR, with e2e green on it.
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    # webServer startup (vite build + vite preview) hanging is a real failure mode worth capping,
    # not just the test run itself.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Browser binary download is the slow part of Playwright setup, not the OS-level apt
      # dependencies (those are cheap and can't be cached anyway — GitHub Actions runners are a
      # fresh VM every run). Cache just the binary directory; on a hit, skip the redundant download
      # but still ensure the (uncacheable) OS deps are present via install-deps.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Every merge to main deploys to GitHub Pages, but only once both test jobs pass, so a red build
  # never ships. Pull requests run the tests and stop there. Needs the repo's Pages source set to
  # "GitHub Actions"; `base` in vite.config.ts must match the /coding-playground/ project path.
  deploy:
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v5
